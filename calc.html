
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Calculadora</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }

        .box {
            width: 50px;
            height: 50px;
            margin: 0px;
            background: #fff;
            color: #000;
            border-radius: 5px;
            border: 1px solid black;
            text-align: center;
            display: flex;
            justify-content: center; 
            align-items: center;
        }

        .smallbox {
            width: 300px;
            height: 200px;
            margin: 0px;
            background: #fff;
            color: #000;
            border-radius: 5px;
            border: 1px solid black;
            text-align: center;
            display: flex;
            justify-content: center; 
            align-items: center;
        }

    </style>
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!--jQuery UI lib-->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.js"></script>

    <script src="https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/jquery-ui-for-ipad-and-iphone/jquery.ui.touch.js"></script>
    <script src="https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/jquery-ui-for-ipad-and-iphone/jquery.ui.ipad.altfix.js"></script>
    <script src="https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/jquery-ui-for-ipad-and-iphone/jquery.ui.ipad.js"></script>
    <script>
        $(document).ready(function(){
            console.log("Ready");
            $("#submit").on("click", function(){
                console.log("Clicking");
                let n1b = $("#op1").val();
                let n2b = $("#op2").val();
                let n1 = parseFloat(n1b);
                let n2 = parseFloat(n2b);
                let operator = $("#operator").val();
                let result = "";
                let operationlog = "";
                let oplog = "";
                if(operator != "a"){
                    if(n1b != "" & n2b != ""){
                        if(operator == "add"){
                            result = n1 + n2;
                            oplog = n1b + "+" + n2b + "=" + result;
                           // operationlog = '<input type="number" value="' + oplog + '">'
                            operationlog = "hello world"
                            $("#op_done").innerHTML = operationlog;
                        }
                        if(operator == "substract"){
                            result = n1 - n2;
                        }
                        if(operator == "multiply"){
                            result = n1 * n2;
                        }
                        if(operator == "divide"){
                            if(n2 != 0){
                                result = n1 / n2;
                            }
                            else{
                                alert("Dividing by 0 is an impossible operation. Please introduce a valid number.");
                            }
                        }
                    }
                    else{
                    alert("Introduce any number in the box.");
                    }
                }
                else{
                    alert("Select an operator.");
                }
                console.log(operator);
                let gresult = parseFloat(result);
                let but_result = $("#result");
                but_result.attr("value", gresult);
            });

        });
    </script>
    <!--jQuery UI style-->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

</head>
<body>
    <div class="numbers">
        <input type="number" id="op1"><br>
        <select id="operator">
            <option value="a" selected>Select your operation</option>
            <option value="add">Add (+)</option>
            <option value="substract">Substract (-)</option>
            <option value="multiply">Multiply (*)</option>
            <option value="divide">Divide (:)</option>
        </select>
        <br>
        <input type="number" id="op2"><br>
        <button type="submit" id="submit">Submit (=)</button>
        <p>Result:</p>
        <input type="number" id="result"><br>
        <div id="op_done"></div>

    </div>
    <p>TO DO</p>
</body>
</html>
